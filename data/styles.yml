    color: '#e63c8f' #f65f62
    light: '#ffffff'
    dark: '#ffffff'
    turn:
      fill: false
      in: true
      text: true
  alt:
    color: '#ffffff' #790709
    light: '#ffffff'
    dark: '#ffffff'
