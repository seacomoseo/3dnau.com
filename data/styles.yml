  weight: 700
  grade: 0
  optical: 24
  style: outlined
  def:
    play: svg:youtube-iframe
fonts:
  base:
    family: Montserrat # Lora # Barlow
    weight: 400
    bold: 600 # 700
    italic: false
    line_height: 1.25
  cursive:
    family: Montserrat # Lora # Barlow
    weight: 600 # 400 # 600
    bold: 0
