name: Nuestro Recorrido
id: recorrido
size: md
boxes:
- title: '{{ get landing_sections.path.title }}'
  sub: '{{ get landing_sections.path.sub }}'
  icon: '{{ get landing_sections.path.icon }}'
  box:
    cols: 2
    gap: 4
    gap_vs: 2
    align_y: center
    align: left
  boxes:
  - img: '{{ get landing_sections.path.img }}'
  - get:
    - from: landing_sections.path.md
      to: md
