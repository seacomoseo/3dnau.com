name: Hero Landing
color: dark
bi: '{{ get landing_sections.header.bi }}'
full: true
size: md
div: squares
box:
  cols: 2
  gap: 4
  gap_vs: 2
  align_y: center
  align: left
boxes:
- box:
    gap: 2
  boxes:
  - hanchor: '{{ get landing_sections.header.hanchor }}'
    title: '{{ get landing_sections.header.title }}'
    line: false
  - pin: download
    label: '{{ get landing_sections.header.label }}'
    url: '#descarga'
- img: '{{ get landing_sections.header.img }}'
  url: '#descarga'
  btn: hide
